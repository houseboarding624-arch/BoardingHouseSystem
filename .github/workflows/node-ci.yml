name: Node CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix backend

      - name: Check backend syntax
        run: find backend/src backend/scripts -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Build frontend
        run: npm run build
